[package]
name = "mini_redis"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
description = "An educational Redis-like server and client built with Tokio"
repository = "https://github.com/Qihang-Li/mini-redis"
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bytes = "1"
clap = { version = "4.6.6", features = ["derive"] }

[lints.clippy]
# Apply the group first so individual lint settings can override it.
pedantic = { level = "warn", priority = -1 }